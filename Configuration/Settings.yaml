Flownative:
  OpenIdConnect:
    Neos:
      # Claims which contain role identifiers, or claims with a mapping of their values to role identifiers. If set, the identity
      # provider decides the roles of Neos users: they replace the roles of the account with every login. If empty, the roles
      # are managed in Neos.
      rolesFromClaims: []
      # Creates a Neos user on the first login of an identity which has no account yet
      autoCreateUser: false
      # Roles of a user created by "autoCreateUser", if the roles are managed in Neos. With "rolesFromClaims", the claims alone
      # decide the roles.
      rolesForAutoCreatedUser: []
      # Claims which contain the values of a user created by "autoCreateUser". "name" is only used if neither "firstname" nor
      # "lastname" is present. The email address is only stored if the claim "email_verified" is true.
      identityValueMapping:
        firstname: 'given_name'
        lastname: 'family_name'
        name: 'name'
        email: 'email'
      # Signs the user out at the identity provider as well, when they sign out of Neos with a POST request
      signOutAtIdentityProvider: false
      # Absolute URI the identity provider redirects to after signing out. If empty, it's the login page of Neos.
      postLogoutRedirectUri: null

    Client:
      services:
        neos:
          options:
            discoveryUri: '%env:OIDC_DISCOVERY_URI%'
            clientId: '%env:OIDC_CLIENT_ID%'
            clientSecret: '%env:OIDC_CLIENT_SECRET%'

Neos:
  Flow:
    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            label: 'OpenID Connect'
            provider: 'Flownative\OpenIdConnect\Client\Authentication\OpenIdConnectProvider'

            requestPatterns:
              'Neos.Neos:BackendControllers':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Neos\Neos\Controller\.*'
              'Neos.Neos:ServiceControllers':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Neos\Neos\Service\.*'

            providerOptions:
              serviceName: 'neos'
              accountIdentifierTokenValueName: 'email'
              accountResolver: 'Flownative\OpenIdConnect\Neos\Authentication\NeosUserAccountResolver'
            token: 'Flownative\OpenIdConnect\Client\Authentication\OpenIdConnectSessionToken'
            entryPoint: 'Flownative\OpenIdConnect\Client\Authentication\OpenIdConnectEntryPoint'
            entryPointOptions:
              serviceName: 'neos'
              scope: 'openid profile email'
              requestRefreshToken: false

        authenticationStrategy: oneToken
